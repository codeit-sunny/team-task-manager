{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4 mt-5">

            <h2 class="text-center mb-4">Login</h2>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-primary w-100">
                    Login
                </button>
            </form>

            <hr>

            <p class="text-center">
                Don't have an account?
            </p>

            <a href="/signup/" class="btn btn-success w-100">
                Create Account
            </a>

        </div>
    </div>
</div>

{% endblock %}
