{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4 mt-5">

            <h2 class="text-center mb-4">Create Account</h2>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-success w-100">
                    Signup
                </button>
            </form>

            <hr>

            <a href="/login/" class="btn btn-outline-primary w-100">
                Back to Login
            </a>

        </div>
    </div>
</div>

{% endblock %}
